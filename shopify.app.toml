# NUVUS Group Drop — Shopify embedded app

client_id = "5224ae23e313c34baef32eddca3a33dc"
name = "nuvus-drops"
embedded = true

[access_scopes]
scopes = "write_products,read_orders,write_orders"

[webhooks]
api_version = "2024-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = ["orders/create"]
  uri = "https://nuvus-kohl.vercel.app/api/webhooks/order-create"
application_url = "https://nuvus-kohl.vercel.app"

[auth]
redirect_urls = [
  "https://nuvus-kohl.vercel.app/api/auth/callback",
  "https://nuvus-kohl.vercel.app/auth/callback"
]